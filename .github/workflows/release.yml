name: Release APK

# 打 tag 即发版：git tag v0.9.8-n1 && git push origin v0.9.8-n1
# 产物：正式签名 APK（与本地覆盖安装兼容），挂到 GitHub Release 下。
# 主线为 android-native（Kotlin + Compose）；archive-flutter/ 仅参考，不编译。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: android-native

      # 正式签名：Secrets 里配 KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD
      # （keystore 转 base64：base64 -w0 android/keystore/pideck-release.jks）。缺 Secrets
      # 时降级为 debug 签名，包能装但与正式版签名不一致、不可覆盖安装。
      - name: restore release keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/pideck-release.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore/pideck-release.jks
          EOF
            echo "release signing configured"
          else
            echo "no keystore secrets, debug-key fallback build"
          fi

      - name: build release apk
        run: ./gradlew :app:assembleRelease
        working-directory: android-native

      - name: publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-native/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
